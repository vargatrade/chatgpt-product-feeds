name: KupTeraz.sk – aktualizacia OpenAI feedu

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2,6,10,14,18,22 * * *'
      timezone: 'Europe/Bratislava'

permissions:
  contents: write

concurrency:
  group: kupteraz-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Previesť aktuálny Webareal XML do OpenAI CSV
        run: python convert_feed.py
      - name: Priebežne publikovať bez straty posledného funkčného exportu
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path
          p = Path('.heartbeat')
          today = date.today()
          try:
              last = date.fromisoformat(p.read_text(encoding='utf-8').strip())
          except (FileNotFoundError, ValueError):
              last = date(2000, 1, 1)
          if (today - last).days >= 28:
              p.write_text(today.isoformat() + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/kupteraz-chatgpt.csv .heartbeat
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualizácia ChatGPT katalógu KupTeraz.sk'
            git push
          else
            echo 'Produkty sa nezmenili, nie je čo publikovať.'
          fi
